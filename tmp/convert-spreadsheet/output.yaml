  category: Sustainability (ICE)
  comment: Vehicles may calculate accumulated idle time for an engine. It might be
    based on engine speed (rpm) below a certain limit or any other mechanism.
  datatype: float
  description: Accumulated idling time during engine lifetime. Definition of idling
    is not standardized.
  importance: Should Have
  sampling: Vehicle.LowVoltageSystemState='START'
  type: sensor
  unit: h
  usecase: SUSTAINABILITY02
Vehicle.Powertrain.CombustionEngine.Speed:
  category: Safety
  datatype: float
  description: Engine speed measured as rotations per minute.
  importance: Should Have
  sampling: 0.033333333333333Hz
  type: sensor
  unit: rpm
  usecase: SAFETY14
Vehicle.Powertrain.FuelSystem.AbsoluteLevel:
  category: Sustainability (ICE)
  datatype: float
  description: Current available fuel in the fuel tank expressed in liters.
  importance: Should Have
  sampling: 0.0083333333333333Hz
  type: sensor
  unit: l
  usecase: SUSTAINABILITY01
Vehicle.Powertrain.FuelSystem.ConsumptionSinceStart:
  category: Sustainability (EV)
  comment: A new trip is considered to start when engine gets enabled (e.g. LowVoltageSystemState
    in ON or START mode). A trip is considered to end when engine is no longer enabled.
    The signal may however keep the value of the last trip until a new trip is started.
  datatype: float
  description: Fuel amount in liters consumed since start of current trip.
  importance: Must Have
  sampling: Vehicle.LowVoltageSystemState='START'
  type: sensor
  unit: l
  usecase: SUSTAINABILITY05
Vehicle.Powertrain.FuelSystem.RelativeLevel:
  category: Sustainability (ICE)
  datatype: uint8
  description: Level in fuel tank as percent of capacity. 0 = empty. 100 = full.
  importance: Must Have
  max: 100
  min: 0
  sampling: 0.0083333333333333Hz
  type: sensor
  unit: percent
  usecase: SUSTAINABILITY01
Vehicle.Powertrain.FuelSystem.SupportedFuelTypes:
  allowed:
  - GASOLINE
  - DIESEL
  - E85
  - LPG
  - CNG
  - LNG
  - H2
  - OTHER
  category: Sustainability (ICE)
  comment: If a vehicle also has an electric drivetrain (e.g. hybrid) that will be
    obvious from the PowerTrain.Type signal.
  datatype: string[]
  description: High level information of fuel types supported
  importance: Must Have
  sampling: Vehicle.LowVoltageSystemState='START'
  type: attribute
  usecase: SUSTAINABILITY01
Vehicle.Powertrain.FuelSystem.TankCapacity:
  category: Sustainability (ICE)
  datatype: float
  description: Capacity of the fuel tank in liters.
  importance: Should Have
  sampling: .nan
  type: attribute
  unit: l
  usecase: SUSTAINABILITY01
Vehicle.Powertrain.Range:
  category: Sustainability (ICE)
  datatype: uint32
  description: Remaining range in meters using all energy sources available in the
    vehicle.
  importance: Should Have
  sampling: .nan
  type: sensor
  unit: m
  usecase: SUSTAINABILITY01
Vehicle.Powertrain.TractionBattery.AccumulatedConsumedEnergy:
  category: Sustainability (EV)
  datatype: float
  description: The accumulated energy leaving HV battery for propulsion and auxiliary
    loads over lifetime of the battery.
  importance: Must Have
  sampling: Vehicle.LowVoltageSystemState='START'
  type: sensor
  unit: kWh
  usecase: SUSTAINABILITY10
Vehicle.Powertrain.TractionBattery.Charging.ChargeRate:
  category: Sustainability (EV)
  datatype: float
  description: Current charging rate, as in kilometers of range added per hour.
  importance: Must Have
  sampling: 0.0083333333333333Hz*
  type: sensor
  unit: km/h
  usecase: SUSTAINABILITY09
Vehicle.Powertrain.TractionBattery.Charging.ChargeVoltage.Phase1:
  category: Sustainability (EV)
  datatype: float
  description: Current AC charging voltage (rms) at inlet for Phase 1.
  importance: Must Have
  sampling: 0.0083333333333333Hz*
  type: sensor
  unit: V
  usecase: SUSTAINABILITY09
Vehicle.Powertrain.TractionBattery.Charging.ChargeVoltage.Phase2:
  category: Sustainability (EV)
  datatype: float
  description: Current AC charging voltage (rms) at inlet for Phase 2.
  importance: Must Have
  sampling: 0.0083333333333333Hz*
  type: sensor
  unit: V
  usecase: SUSTAINABILITY09
Vehicle.Powertrain.TractionBattery.Charging.ChargeVoltage.Phase3:
  category: Sustainability (EV)
  datatype: float
  description: Current AC charging voltage (rms) at inlet for Phase 3.
  importance: Must Have
  sampling: 0.0083333333333333Hz*
  type: sensor
  unit: V
  usecase: SUSTAINABILITY09
Vehicle.Powertrain.TractionBattery.Charging.IsCharging:
  category: Sustainability (EV)
  datatype: boolean
  description: True if charging is ongoing. Charging is considered to be ongoing if
    energy is flowing from charger to vehicle.
  importance: Must Have
  sampling: CHANGE
  type: sensor
  usecase: SUSTAINABILITY08
Vehicle.Powertrain.TractionBattery.CurrentCurrent:
  category: Sustainability (EV)
  datatype: float
  description: Current current flowing in/out of battery. Positive = Current flowing
    in to battery, e.g. during charging. Negative = Current flowing out of battery,
    e.g. during driving.
  importance: Must Have
  sampling: 0.0083333333333333Hz*
  type: sensor
  unit: A
  usecase: SUSTAINABILITY09
Vehicle.Powertrain.TractionBattery.GrossCapacity:
  category: Sustainability (EV)
  datatype: uint16
  description: Gross capacity of the battery.
  importance: Must Have
  sampling: 0.0083333333333333Hz*
  type: attribute
  unit: kWh
  usecase: SUSTAINABILITY09
Vehicle.Powertrain.TractionBattery.NetCapacity:
  category: Sustainability (EV)
  datatype: uint16
  description: Total net capacity of the battery considering aging.
  importance: Should Have
  sampling: .nan
  type: sensor
  unit: kWh
  usecase: SUSTAINABILITY10
Vehicle.Powertrain.TractionBattery.Range:
  category: Sustainability (EV)
  datatype: uint32
  description: Remaining range in meters using only battery.
  importance: Must Have
  sampling: 0.016666666666667Hz
  type: sensor
  unit: m
  usecase: SUSTAINABILITY06
Vehicle.Powertrain.TractionBattery.StateOfCharge.Current:
  category: Sustainability (EV)
  datatype: float
  description: Physical state of charge of the high voltage battery, relative to net
    capacity. This is not necessarily the state of charge being displayed to the customer.
  importance: Must Have
  max: 100.0
  min: 0
  sampling: CHANGE
  type: sensor
  unit: percent
  usecase: SUSTAINABILITY06
Vehicle.Powertrain.TractionBattery.Temperature:
  category: Efficiency / Optimization / Maintenance
  description: Temperature Information for the battery pack.
  importance: Should Have
  sampling: 0.0033333333333333Hz
  type: branch
  usecase: MAINTENANCE12
Vehicle.Powertrain.Transmission.CurrentGear:
  category: Safety
  datatype: int8
  description: The current gear. 0=Neutral, 1/2/..=Forward, -1/-2/..=Reverse.
  importance: Must Have
  sampling: CHANGE
  type: sensor
  usecase: SAFETY07
Vehicle.Service.DistanceToService:
  category: Efficiency / Optimization / Maintenance
  datatype: float
  description: Remaining distance to service (of any kind). Negative values indicate
    service overdue.
  importance: Should Have
  sampling: Vehicle.LowVoltageSystemState='START'
  type: sensor
  unit: km
  usecase: MAINTENANCE03
Vehicle.Service.IsServiceDue:
  category: Efficiency / Optimization / Maintenance
  datatype: boolean
  description: Indicates if vehicle needs service (of any kind). True = Service needed
    now or in the near future. False = No known need for service.
  importance: Should Have
  sampling: Vehicle.Service.IsServiceDue=true
  type: sensor
  usecase: MAINTENANCE10
Vehicle.Speed:
  category: Sustainability (ICE)
  datatype: float
  description: Vehicle speed.
  importance: Must Have
  sampling: 1Hz
  type: sensor
  unit: km/h
  usecase: SUSTAINABILITY04
Vehicle.TraveledDistance:
  category: Compliance
  datatype: uint32
  description: Odometer reading, total distance traveled during the lifetime of the
    vehicle.
  importance: Must Have
  sampling: Vehicle.LowVoltageSystemState='START'
  type: sensor
  unit: m
  usecase: COMPLIANCE02
Vehicle.VehicleIdentification.VIN:
  category: Efficiency / Optimization / Maintenance
  datatype: string
  description: 17-character Vehicle Identification Number (VIN) as defined by ISO
    3779.
  importance: Must Have
  pattern: ^([0-9A-HJ-NPR-Z]{3})([0-9A-HJ-NPR-Z]{6})([0-9A-HJ-NPR-Z]{4}[0-9]{4})$
  sampling: Vehicle.LowVoltageSystemState='START'
  type: attribute
  usecase: MAINTENANCE01
