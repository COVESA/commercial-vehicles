  min: 0
  unit: mm

Vehicle.Cabin.Seat.Row1.DriverSide.Seating.SideBolsterSupportRight:
  type: actuator
  description: Seat bottom side bolster support right. 0 = Minimum support (widest side bolster setting). 100 = Maximum support.
  datatype: float
  min: 0
  max: 100
  unit: percent

Vehicle.Cabin.Seat.Row1.DriverSide.Seating.SideBolsterSupportLeft:
  type: actuator
  description: Seat bottom side bolster support left. 0 = Minimum support (widest side bolster setting). 100 = Maximum support.
  datatype: float
  min: 0
  max: 100
  unit: percent

Vehicle.Cabin.Seat.Row1.DriverSide.Seating.IsForwardSwitchEngaged:
  type: actuator
  description: Is switch to increase seating length engaged.
  datatype: boolean

Vehicle.Cabin.Seat.Row1.DriverSide.Seating.IsBackwardSwitchEngaged:
  type: actuator
  description: Is switch to decrease seating length engaged.
  comment: Affects the property (Seating.Length).
  datatype: boolean

Vehicle.Cabin.Seat.Row1.DriverSide.Seating.HeatingCooling:
