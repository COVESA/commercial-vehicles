  datatype: uint16
  unit: mm

Vehicle.Chassis.Axle.Row2.TireAspectRatio:
  type: attribute
  description: Aspect ratio between tire section height and tire section width, as per ETRTO / TRA standard.
  datatype: uint8
  unit: percent

Vehicle.Chassis.Axle.Row2.Torque:
