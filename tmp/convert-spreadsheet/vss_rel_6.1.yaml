  unit: s

Vehicle.Powertrain.ElectricMotor.Front.Power:
  type: sensor
  description: Current motor power output. Negative values indicate regen mode.
  datatype: int16
  unit: kW

Vehicle.Powertrain.ElectricMotor.Front.Torque:
