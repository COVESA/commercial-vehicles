  description: Minimum wheel torque request for friction brake. Brake Torque < 0Nm.
  datatype: int16
  max: 0
  unit: Nm

Vehicle.MotionManagement.Brake.Axle.Row1.Wheel.Left.OmegaUpper:
  type: actuator
  description: Upper wheel speed limit request controlled by friction brake. ISO 8855 wheel-spin velocity.
  datatype: uint16
  unit: rad/s

Vehicle.MotionManagement.Brake.Axle.Row1.Wheel.Left.OmegaLower:
  type: actuator
  description: Lower wheel speed limit request controlled by friction brake. ISO 8855 wheel-spin velocity.
  datatype: uint16
  unit: rad/s

Vehicle.MotionManagement.Brake.Axle.Row1.Wheel.Right:
  type: branch
  description: MotionManagement signals for a specific wheel.

Vehicle.MotionManagement.Brake.Axle.Row1.Wheel.Right.Torque:
